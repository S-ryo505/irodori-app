name: build-apk
# main に push されるたびに APK を作り、Releases に置く
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties && ls $ANDROID_HOME/platforms | tail -3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk kazosuke.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.${{ github.run_number }}
          name: カゾスケ v2.${{ github.run_number }}
          body: スマホでこのページを開き、下の kazosuke.apk をタップしてインストールしてください（上書きでOK・データは消えません）。
          files: kazosuke.apk
          make_latest: true
